<style>

*{box-sizing:border-box}html{font-size:var(--fs);scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
a{color:var(--g2)}:focus-visible{outline:3px solid var(--g);outline-offset:2px}

.w{max-width:1180px;margin:0 auto;padding:0 16px}
.top{background:#0f172a;color:#fff;font-size:.8rem;padding:7px 0}

.tl button[aria-pressed=true]{background:var(--g);color:#fff}
.brand{background:var(--card);border-bottom:1px solid var(--line)}

.leg{display:block}
.needs{margin-bottom:10px}.needs b{display:block;margin-bottom:6px}#needs{display:flex;flex-wrap:wrap;gap:6px}

  .nb, .chip, nav a, .acts button, .acts a {

 footer{padding-bottom:70px}
 .hero{padding:22px 0 20px}.hero p{font-size:.95rem}
}

 edu:{ds:"kvmv-ahh4",geo:(la,lo,r)=>bb(la,lo,r,"coordenades_geo_y","coordenades_geo_x"),base:()=>"curs="+q1(CURS),
  pre:async()=>{if(!CURS){const m=await soda("kvmv-ahh4",{$select:"curs,count(*) as n",$group:"curs",$limit:50});CURS=m.map(x=>x.curs).sort().pop()}},
  opts:T=>LVC.map((c,i)=>`<option value="${c}">${esc(T.lv[i])}</option>`).join(""),
  fields:"denominaci_completa,nom_naturalesa,nom_titularitat,adre_a,codi_postal,tel_fon,nom_municipi,url,coordenades_geo_x,coordenades_geo_y,"+LVC.join(","),tx:["denominaci_completa","adre_a","nom_municipi"],
  ord:(la,lo)=>`(coordenades_geo_y-${la})*(coordenades_geo_y-${la})+(coordenades_geo_x-${lo})*(coordenades_geo_x-${lo})`,
  row:x=>({nom:x.denominaci_completa,tipologia:[x.nom_naturalesa,LVC.filter(c=>x[c]).map(c=>I[lang].lv[LVC.indexOf(c)]).join(", ")].filter(Boolean).join(" · "),adreca:x.adre_a,cp:x.codi_postal,municipi:x.nom_municipi,telefon:x.tel_fon,web:x.url,titular:x.nom_titularitat,lat:+x.coordenades_geo_y,lon:+x.coordenades_geo_x})}};
const BW=g=>{const b=g.base?g.base():"";return b?" AND "+b:""};
async function goG(){
 const g=GS[src];
 try{
  const la=sel.p[0],lo=sel.p[1];if(g.pre)await g.pre();
  const W0=r=>g.geo(la,lo,r)+BW(g);let R=5000;
  for(const r of [5000,15000,40000,100000]){R=r;const c=await soda(g.ds,{$select:"count(*) as n",$where:W0(r)});if(+(c[0]&&c[0].n)>=15)break}
  hr=R;hr0=R;let opts;
  if(g.tc){const t=await soda(g.ds,{$select:g.tc+",count(*) as n",$group:g.tc,$where:W0(R),$limit:300});t.sort((a,b)=>b.n-a.n);
   opts=t.filter(x=>x[g.tc]).map(x=>`<option value="${esc(x[g.tc])}">${esc(g.tl?g.tl(x[g.tc]):x[g.tc])} (${x.n})</option>`).join("")}
  else opts=g.opts(I[lang]);
  $("ft").innerHTML=`<option value="">${I[lang].all}</option>`+opts;$("fq").value="";await rowsG();
 }catch(e){say("er")}
}
async function rowsG1(last){
 const g=GS[src],la=sel.p[0],lo=sel.p[1],ty=$("ft").value,f=$("fq").value.trim().toUpperCase();
 let w=g.geo(la,lo,hr)+BW(g);
 if(ty){if(g.tc)w+=` AND ${g.tc}=${q1(ty)}`;else if(LVC.includes(ty))w+=` AND ${ty} IS NOT NULL`}
 if(f){const u=q1("%"+f+"%");w+=" AND ("+g.tx.map(c=>`upper(${c}) like ${u}`).join(" OR ")+")"}
 let r;try{r=await soda(g.ds,{$where:w,$select:g.fields,$order:g.ord(la,lo),$limit:300})}catch(e){}
 if(!r)r=await soda(g.ds,{$where:w,$select:g.fields,$limit:300});
 const c=await soda(g.ds,{$where:w,$select:"count(*) as n"});
 res=r.map(g.row).filter(x=>x.lat&&x.lon).map(x=>({...x,d:hav(sel.p,[x.lat,x.lon])})).sort((a,b)=>a.d-b.d);
 cnt=+(c[0]&&c[0].n)||res.length;if(res.length||last)draw();
}
const ALI=Object.fromEntries([["Lérida","Lleida"],["Gerona","Girona"],["Vich","Vic"],["Tarrasa","Terrassa"],["Figueras","Figueres"],["Rosas","Roses"],["Seo de Urgel","la Seu d'Urgell"],["San Cugat","Sant Cugat del Vallès"],["Villafranca del Penedés","Vilafranca del Penedès"],["Villanueva y Geltrú","Vilanova i la Geltrú"],["Cerdañola","Cerdanyola del Vallès"]].map(([a,b])=>[norm(a),b]));
let FS=[];

function quitNow(){
  if(window.sessionStorage)sessionStorage.clear();
  window.location.replace("https://www.weather.com/");
}

let esc1=0;document.addEventListener("keydown",e=>{if(e.key==="Escape"){const n=Date.now();if(n-esc1<800)quitNow();esc1=n}});
function copyT(t,b){const ok=()=>{const o=b.innerHTML;b.textContent=I[lang].copied;setTimeout(()=>{b.innerHTML=o},1500)};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>{});
 else{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()}}
async function byCP(c){try{let r=await soda("ivft-vegh",{$select:"municipi,count(*) as n",$group:"municipi",$where:"cp="+q1(c),$limit:5});
 if(!r.length)r=await soda("kvmv-ahh4",{$select:"nom_municipi as municipi,count(*) as n",$group:"nom_municipi",$where:"codi_postal="+q1(c),$limit:5});
 r.sort((a,b)=>b.n-a.n);return r[0]?r[0].municipi:""}catch(e){return ""}}
function geoGo(){if(!navigator.geolocation||!Object.keys(capM).length){say("geoer");return}
 navigator.geolocation.getCurrentPosition(pos=>{const p=[pos.coords.latitude,pos.coords.longitude];let b=null,bd=1e9;
  Object.values(capM).forEach(v=>{const d=hav(p,v.p);if(d<bd){bd=d;b=v}});
  if(b&&bd<60){$("q").value=b.name;go(b.name)}else say("geoer")},()=>say("geoer"),{timeout:10000})}
async function firstStep(){
 FS=[];renderFirst();if(!sel||!sel.p)return;
 const cat="categoria like 'Serveis socials bàsics|Servei bàsic d%atenci%social%'",la=sel.p[0],lo=sel.p[1];
 try{let r=[];
  for(const R of [5000,15000,40000,100000]){r=await soda("8gmd-gz7i",{$where:`within_circle(localitzacio,${la},${lo},${R}) AND ${cat}`,$select:"nom,via,num,cpostal,poblacio,telefon1,latitud,longitud",$limit:50});if(r.length)break}
  FS=r.map(x=>({...x,d:hav(sel.p,[+x.latitud,+x.longitud])})).sort((a,b)=>a.d-b.d).slice(0,2);renderFirst();
 }catch(e){}
}
function renderFirst(){
 const T=I[lang],box=$("first");if(!FS.length){box.hidden=true;box.innerHTML="";return}
 box.innerHTML=`<h3><i class="fa-solid fa-flag"></i> ${T.fs_h}</h3><p>${T.fs_p}</p>`+FS.map(x=>{
  const a=[x.via,x.num&&x.num!=="0"?x.num:"",pc(x.cpostal),x.poblacio].filter(Boolean).join(", "),t=String(x.telefon1||"").replace(/[^0-9+]/g,"");
  return `<div class="rc" style="--c:#b45309"><span class="km">${x.d<1?"< 1 km":"≈ "+x.d.toFixed(1)+" km"}</span><h3>${esc(x.nom)}</h3><small>${esc(a)}</small>${t?`<br><a class="btn" href="tel:${t}"><i class="fa-solid fa-phone"></i> ${T.call} ${esc(x.telefon1)}</a>`:""}<div class="acts"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.latitud+","+x.longitud)}" target="_blank" rel="noopener"><i class="fa-solid fa-route"></i> ${T.route}</a></div></div>`}).join("")+`<p class="note">${T.cita}</p>`;
 box.hidden=false}
async function rowsG(){
 const rd=[hr0,15000,40000,100000].filter((r,i,a)=>r>=hr0&&a.indexOf(r)===i).sort((a,b)=>a-b);
 for(let i=0;i<rd.length;i++){hr=rd[i];await rowsG1(i===rd.length-1);if(res.length)return}
}
let DIP=null;
const isStd=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const instStore=v=>{try{localStorage.setItem("afronta_inst",v)}catch(e){}};
const instDone=()=>{try{const v=localStorage.getItem("afronta_inst");if(v==="have")return true;return /^\d+$/.test(v||"")&&Date.now()-(+v)<30*864e5}catch(e){return false}};
function showInst(){const b=$("inst"),T=I[lang];
 if(isStd()||instDone()||!window.matchMedia("(max-width:860px)").matches||(!DIP&&!isIOS())){b.hidden=true;return}
 b.innerHTML=`<div class="inst2"><img src="img/icon-192.png" alt="" width="48" height="48"><div><b>${T.inst_t}</b><p>${T.inst_b}</p>${DIP?"":`<p>${T.inst_ios}</p>`}<p class="shr">${T.inst_shr}</p><div class="inst-a">${DIP?`<button class="btn" data-inst="go">${T.inst_btn}</button>`:""}<button class="nb" data-inst="have">${T.inst_have}</button></div></div><button class="inst-x" data-inst="x" aria-label="${T.inst_x}">✕</button></div>`;b.hidden=false}
function updOff(){const b=$("offb");b.hidden=navigator.onLine;b.textContent=I[lang].off}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DIP=e;showInst()});
window.addEventListener("appinstalled",()=>{instStore("have");$("inst").hidden=true});
window.addEventListener("offline",updOff);
window.addEventListener("online",()=>{updOff();if(!reg.length)init();else if(sel&&!res.length)go(sel.name)});
function renderNeeds(){const T=I[lang];$("needs").innerHTML=T.nd.map((n,i)=>`<button class="nb" data-nd="${i}" aria-pressed="${i===need}">${n}</button>`).join("");
 const h=$("help"),N=src==="soc"?NEEDS[need]:null;if(N&&N.h){h.hidden=false;h.innerHTML=`<i class="fa-solid fa-phone"></i> ${T.hl[N.h]} <a class="btn" href="tel:${N.t}">${N.t.replace("116111","116 111")}</a>`}else h.hidden=true}

function text(){
 const T=I[lang],ix={ca:0,es:1,en:2}[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 [["t_em","em"],["t_hc","hc"],["t_band","band"],["t_bandl","bandl"],["t_badge","badge"],["t_h1","h1"],["t_hp","hp"],["t_go","go"],["t_quick","quick"],["t_tag1","tag1"],["t_h2a","h2a"],["t_note","note"],["t_tag2","tag2"],["t_h2b","h2b"],["t_pb","pb"],["t_news","news"],["t_tag3","tag3"],["t_h2c","h2c"],["t_dirs","dirs"],["t_rd","rd"],["t_ez","easy"],["t_need","need"],["t_kw","kw"],["t_priv_h","priv_h"],["t_priv","priv"],["t_priv2","priv2"],["t_priv3","priv3"],["t_qe","qe"],["t_geo","geo"],["t_pr","pr"],["t_tag4","tag4"],["t_ab_h","ab_h"],["t_ab1","ab1"],["t_ab2","ab2"],["t_ab2b","ab2b"],["t_cl","cl"],["t_ab3","ab3"]].forEach(([i,k])=>$(i).textContent=T[k]);
 $("q").placeholder=T.ph;$("n4").textContent=T.n4;showInst();updOff();$("e112").setAttribute("aria-label",T.c112);$("vt").innerHTML=T.vw.map((n,i)=>`<button class="nb" data-vw="${i}" aria-pressed="${(i===1)===mapView}">${n}</button>`).join("");renderFirst();$("leg").textContent=(src==="soc"?T.src:src==="far"?T.hsrc:T.srcX[src])+" · "+T.upd(new Date().toLocaleDateString(lang),UPD?UPD.toLocaleDateString(lang):"");$("seg").innerHTML=T.srcs.map((n,i)=>`<button class="nb" data-src="${["soc","sal","edu","far"][i]}" aria-pressed="${src===["soc","sal","edu","far"][i]}">${n}</button>`).join("");$("needsb").hidden=src!=="soc";renderNeeds();if(document.body.classList.contains("easy"))$("t_hp").textContent=T.easyhp;$("fq").placeholder=T.fph;if(src==="soc"&&$("ft").options[0])$("ft").options[0].textContent=T.all;["n1","n2","n3"].forEach((id,i)=>$(id).textContent=T.n[i]);
 $("quick").innerHTML=QUICK.map(q=>`<button class="chip" data-q="${q}">${q}</button>`).join("");
 $("dirs").innerHTML=DIRS.map((d,i)=>`<a class="ac" href="${d[1]}" target="_blank" rel="noopener"><i class="fa-solid ${d[0]}"></i><b>${T.dl[i]}</b><span>${T.open} →</span></a>`).join("");
 const card=a=>a.map(x=>`<a class="ac" href="${x[2]}" target="_blank" rel="noopener"><i class="fa-solid ${x[0]}"></i><b>${x[1]}</b><span>${T.open} →</span></a>`).join("");
 $("alerts").innerHTML=card(ALERTS);$("news").innerHTML=card(NEWS);
 $("al").innerHTML=AIDS.map((a,i)=>`<button data-aid="${i}" aria-pressed="${i===aid}">${at(i)[0]}</button>`).join("");
 $("dt").innerHTML=aid<0?`<p>${T.pickA}</p>`:`<h3>${at(aid)[0]}</h3><p>${at(aid)[1]}</p><a class="btn" href="${AIDS[aid][2]}" target="_blank" rel="noopener">${T.more}</a><p class="note">${T.revd}: ${REV}</p>`;
 if(sel&&res.length)draw();else if(!names.length&&!reg.length)say("ld");else if(!sel)say("ready");
}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.inst){const k=b.dataset.inst;if(k==="go"&&DIP){const d=DIP;DIP=null;d.prompt();d.userChoice.then(c=>{if(c.outcome==="accepted")instStore("have")})}else if(k==="have")instStore("have");else instStore(String(Date.now()));$("inst").hidden=true}
 else if(b.dataset.vw!==undefined){mapView=b.dataset.vw==="1";document.querySelector(".split").classList.toggle("mv-map",mapView);text()}
 else if(b.id==="cl"){need=-1;renderNeeds();if(sel)go(sel.name);else{$("fq").value="";$("ft").value=""}}
 else if(b.id==="qe"){quitNow()}
 else if(b.id==="geo"){geoGo()}
 else if(b.id==="pr"){window.print()}
 else if(b.dataset.cp!==undefined){copyT(b.closest(".rc").dataset.t,b)}
 else if(b.dataset.sh!==undefined){const t=b.closest(".rc").dataset.t;if(navigator.share)navigator.share({title:I[lang].h1,text:t}).catch(()=>{});else copyT(t,b)}
 else if(b.dataset.src){src=b.dataset.src;need=-1;res=[];text();if(sel)go(sel.name)}
 else if(b.dataset.nd!==undefined){need=need===+b.dataset.nd?-1:+b.dataset.nd;renderNeeds();if(sel)rows()}
 else if(b.id==="rd"){if(window.speechSynthesis&&speechSynthesis.speaking)speechSynthesis.cancel();else speak($("msg").textContent+". "+[...document.querySelectorAll(".rc")].slice(0,5).map(rcText).join(". "))}
 else if(b.id==="ez"){document.body.classList.toggle("easy");b.setAttribute("aria-pressed",document.body.classList.contains("easy"));text()}
 else if(b.dataset.ls!==undefined){speak(rcText(b.closest(".rc")))}
 else if(b.dataset.q){$("q").value=b.dataset.q;go(b.dataset.q)}
 else if(b.dataset.aid){aid=+b.dataset.aid;text()}
 else if(b.id==="hc"){document.body.classList.toggle("hc");b.setAttribute("aria-pressed",document.body.classList.contains("hc"))}
 else if(b.id==="fp"||b.id==="fm"){const r=document.documentElement,c=parseFloat(getComputedStyle(r).fontSize);r.style.setProperty("--fs",Math.min(26,Math.max(13,c+(b.id==="fp"?2:-2)))+"px")}});
$("sf").onsubmit=e=>{e.preventDefault();go($("q").value)};
$("lang").onchange=e=>{lang=e.target.value;text()};
$("ft").onchange=()=>{if(sel)rows()};$("fq").onchange=()=>{if(sel)rows()};
text();init();

  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
